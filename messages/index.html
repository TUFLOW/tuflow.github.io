<!DOCTYPE html>
<!-- To be placed in the _site directory when website has built. Will automatically redirect from .../messages/ to .../messages/en-au/ -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script>window.location.replace(window.location.href.replace(/\/?$/, '/') + 'en-au/');</script>
	
    <title>TUFLOW Messages</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #005581, #1ABDC9);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            min-width: 460px;
            width: calc(100% - 200px);
            margin-left: 200px;
        }

        a { 
            color: white;
            font-weight: bold;
        }

        .text {
            color: white;
            font-size: 18px;
            margin-top: 20px;
            line-height: 1.4;
            text-align: left;
            max-width: 460px;
        }

        h1 {
            color: white;
            font-size: 60px;
            margin-bottom: 20px;
        }

        .explanation {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>TUFLOW Messages</h1>
    </div>
    <div class="logo-container">
		<div class="text explanation">
		    You will be redirected to <a id="redirect-link"> TUFLOW Messages</a> shortly...<br/>
		    <script>var l=document.getElementById('redirect-link');l.href=window.location.href.replace(/\/?$/,'/')+'en-au/';</script>
			If you are not redirected automatically, please click the link.
		</div>
	</div>
</body>
</html>
