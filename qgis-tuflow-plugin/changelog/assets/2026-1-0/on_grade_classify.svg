<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" font-family="Arial" font-size="13">

  <!-- Background -->
  <rect width="600" height="350" fill="#f9f9f9" rx="10"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ON GRADE — Inlet on Continuous Slope</text>

  <!-- Axes -->
  <line x1="60" y1="280" x2="560" y2="280" stroke="#999" stroke-width="1.5"/>
  <line x1="60" y1="50"  x2="60"  y2="280" stroke="#999" stroke-width="1.5"/>
  <text x="310" y="310" text-anchor="middle" fill="#555">Distance Along Road</text>
  <text x="20"  y="170" text-anchor="middle" fill="#555" transform="rotate(-90,20,170)">Elevation</text>

  <!-- Elevation profile curve (grade shape - continuous slope) -->
  <polyline
    points="80,90 160,130 240,175 310,210 380,235 460,255 540,265"
    fill="none" stroke="#2196F3" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inlet point -->
  <circle cx="310" cy="210" r="7" fill="#e53935"/>
  <text x="310" y="202" text-anchor="middle" fill="#e53935" font-weight="bold">Inlet</text>

  <!-- US Peak -->
  <circle cx="80" cy="90" r="6" fill="#43a047"/>
  <text x="80" y="82" text-anchor="middle" fill="#43a047" font-weight="bold">Peak US</text>

  <!-- DS Peak (low - on the slope) -->
  <circle cx="540" cy="265" r="6" fill="#fb8c00"/>
  <text x="540" y="257" text-anchor="middle" fill="#fb8c00" font-weight="bold">Peak DS</text>

  <!-- US tolerance annotation (meets threshold) -->
  <line x1="80" y1="90" x2="80" y2="210" stroke="#43a047" stroke-width="1" stroke-dasharray="4"/>
  <text x="90" y="155" fill="#43a047" font-size="11">≥ tolerance ✓</text>

  <!-- DS tolerance annotation (does not meet threshold) -->
  <line x1="540" y1="210" x2="540" y2="265" stroke="#fb8c00" stroke-width="1" stroke-dasharray="4"/>
  <text x="548" y="242" fill="#fb8c00" font-size="11">&lt; tolerance ✗</text>

  <!-- sample_dist arrows -->
  <line x1="310" y1="290" x2="80"  y2="290" stroke="#555" stroke-width="1" marker-end="url(#arrow2)" marker-start="url(#arrow2)"/>
  <line x1="310" y1="290" x2="540" y2="290" stroke="#555" stroke-width="1" marker-end="url(#arrow2)" marker-start="url(#arrow2)"/>
  <text x="195" y="305" text-anchor="middle" fill="#555" font-size="11">Extract Distance</text>
  <text x="425" y="305" text-anchor="middle" fill="#555" font-size="11">Extract Distance</text>

  <!-- Label -->
  <rect x="210" y="315" width="180" height="25" rx="5" fill="#fb8c00"/>
  <text x="300" y="332" text-anchor="middle" fill="white" font-weight="bold">→ ON GRADE</text>

  <defs>
    <marker id="arrow2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
</svg>